plugins {
    id 'com.android.application'
}

android {
    namespace 'com.granaok.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.granaok.app'
        minSdk 23
        targetSdk 35
        versionCode 16
        versionName '0.5.1-beta'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            applicationIdSuffix '.beta'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

tasks.register('decodeGranaOkBranding') {
    doLast {
        def brandingDir = file("${rootDir}/branding")
        def parts = brandingDir.listFiles()
            .findAll { it.name.startsWith('granaok_icon.b64.part') }
            .sort { a, b -> a.name <=> b.name }
        if (parts.isEmpty()) {
            throw new GradleException('Arquivos da identidade visual GranaOk não encontrados.')
        }
        def encoded = parts.collect { it.getText('UTF-8').replaceAll('\\s', '') }.join('')
        def bytes = java.util.Base64.getDecoder().decode(encoded)

        def drawableDir = file('src/main/res/drawable-nodpi')
        drawableDir.mkdirs()
        file("${drawableDir}/granaok_icon.webp").bytes = bytes

        def webDir = file('src/main/assets/www')
        webDir.mkdirs()
        file("${webDir}/granaok_icon.webp").bytes = bytes
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('decodeGranaOkBranding')
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'org.mariadb.jdbc:mariadb-java-client:2.7.13'
    // Modelo latino empacotado no APK: OCR funciona sem download posterior do modelo.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Extrai primeiro a camada de texto de PDFs bancários; OCR fica como fallback.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
