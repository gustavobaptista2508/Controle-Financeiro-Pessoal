<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GranaOk">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/styles.css">
<title>GranaOk</title>
</head>
<body>
<section id="login" class="login hidden">
  <form id="login-form" class="login-card">
    <div class="brand">Grana<span>Ok</span><small>iPHONE / LAN</small></div>
    <h1>Entrar</h1>
    <p>Use um usuário criado no GranaOk Desktop.</p>
    <label>Usuário</label><input id="login-user" autocomplete="username" required>
    <label>Senha</label><input id="login-pass" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Entrar</button>
    <div id="login-out"></div>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div><div class="brand small">Grana<span>Ok</span></div><small id="who"></small></div>
    <button id="logout" class="ghost">Sair</button>
  </header>
  <main id="content"></main>
  <nav class="bottom">
    <button data-view="dashboard" class="active">⌂<span>Início</span></button>
    <button data-view="transactions">⇄<span>Lançamentos</span></button>
    <button data-view="cards">▣<span>Cartões</span></button>
    <button data-view="financings">▤<span>Financ.</span></button>
    <button data-view="more">•••<span>Mais</span></button>
  </nav>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><button id="modal-close" class="modal-close">×</button><div id="modal-content"></div></div></div>
<script src="/app.js"></script>
</body>
</html>
