name: Export AutoLog Transfer Debug

on:
  push:
    branches: [autolog-ia-build]
    paths:
      - '.github/workflows/export-autolog-transfer-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload received chunks
        uses: actions/upload-artifact@v4
        with:
          name: autolog-received-chunks
          path: |
            autolog-ia-source.part01
            autolog-ia-source.part04
          if-no-files-found: error
