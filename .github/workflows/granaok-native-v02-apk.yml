name: GranaOK Native v0.2.1 APK

on:
  push:
    branches:
      - build/granaok-native-v02-apk
    paths:
      - '.build-native-v02/**'
      - '.github/workflows/granaok-native-v02-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct native source
        shell: bash
        run: |
          set -euo pipefail
          cat .build-native-v02/source.b64.* | base64 --decode > /tmp/GranaOK_Android_Native_v0_2.zip
          unzip -t /tmp/GranaOK_Android_Native_v0_2.zip
          rm -rf native-build
          mkdir -p native-build
          unzip -q /tmp/GranaOK_Android_Native_v0_2.zip -d native-build
          test -f native-build/GranaOK_Android_Native_v0_2/settings.gradle.kts
          test -f native-build/GranaOK_Android_Native_v0_2/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure compatible Android stack
        shell: bash
        run: |
          set -euo pipefail
          APP='native-build/GranaOK_Android_Native_v0_2/app/build.gradle.kts'
          CATALOG='native-build/GranaOK_Android_Native_v0_2/gradle/libs.versions.toml'
          PROPS='native-build/GranaOK_Android_Native_v0_2/gradle.properties'
          sed -i 's/compileSdk = 37/compileSdk = 35/' "$APP"
          sed -i 's/targetSdk = 37/targetSdk = 35/' "$APP"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native-build/GranaOK_Android_Native_v0_2/gradle/libs.versions.toml')
          s=p.read_text()
          repl={
            'composeBom = "2026.08.00"':'composeBom = "2025.05.01"',
            'activity = "1.13.0"':'activity = "1.10.1"',
            'lifecycle = "2.11.0"':'lifecycle = "2.9.0"',
            'navigation = "2.10.0"':'navigation = "2.9.0"',
            'room = "2.8.4"':'room = "2.7.1"',
            'datastore = "1.2.1"':'datastore = "1.1.7"',
            'fragment = "1.9.0"':'fragment = "1.8.8"',
            'core = "1.18.0"':'core = "1.16.0"',
          }
          for a,b in repl.items():
              s=s.replace(a,b)
          p.write_text(s)
          PY
          printf '\nandroid.newDsl=false\n' >> "$PROPS"
          grep -E 'compileSdk|targetSdk' "$APP"
          sed -n '1,18p' "$CATALOG"

      - name: Apply native v0.2.1 patch
        shell: bash
        run: |
          python3 .build-native-v02/patch_native.py
          grep -R 'X-GranaOk-Client", "android"' native-build/GranaOK_Android_Native_v0_2/app/src/main/java
          grep -q 'AppUpdateManager' native-build/GranaOK_Android_Native_v0_2/app/src/main/java/br/com/granaok/app/MainActivity.kt
          grep -q 'REQUEST_INSTALL_PACKAGES' native-build/GranaOK_Android_Native_v0_2/app/src/main/AndroidManifest.xml

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -Pandroid.newDsl=false -p native-build/GranaOK_Android_Native_v0_2 :app:assembleRelease --stacktrace
          APK="$(find native-build/GranaOK_Android_Native_v0_2/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          cp "$APK" GranaOK-Android-Native-v0.2.1-UNSIGNED.apk
          ls -lh GranaOK-Android-Native-v0.2.1-UNSIGNED.apk

      - name: Package Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" android-signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" android-signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-signing-tools/lib/
          chmod +x android-signing-tools/apksigner android-signing-tools/zipalign
          tar -czf android-signing-tools-35.0.0.tar.gz android-signing-tools

      - name: Upload unsigned native APK
        uses: actions/upload-artifact@v4
        with:
          name: GranaOK-Android-Native-v0.2.1-UNSIGNED
          path: GranaOK-Android-Native-v0.2.1-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tools-35.0.0
          path: android-signing-tools-35.0.0.tar.gz
          if-no-files-found: error
          retention-days: 30
