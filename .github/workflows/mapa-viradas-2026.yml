name: Mapa de viradas municipais 2026 - TSE
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
  push:
    paths:
      - 'eleicoes2026/gerar_mapa_viradas.py'
      - 'eleicoes2026/tests/test_mapa.py'
      - '.github/workflows/mapa-viradas-2026.yml'
permissions:
  contents: write
concurrency:
  group: mapa-viradas-2026
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: python -m pip install --disable-pip-version-check requests
      - name: Verificar parser com dados sintéticos
        run: python -m unittest discover -s eleicoes2026/tests -p 'test_mapa.py' -v
      - name: Processar dados oficiais do TSE
        run: python eleicoes2026/gerar_mapa_viradas.py --out eleicoes2026/data/viradas_municipios_2026.json
      - name: Publicar consolidado nacional com controle de versão
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eleicoes2026/data/viradas_municipios_2026.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: publicar viradas municipais oficiais TSE 2026'
            git push
          else
            echo 'Consolidado sem alterações.'
          fi
