name: Build JOMAD Ponto APK

on:
  push:
    branches:
      - jomad-ponto-build-20260814
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Rebuild Android source archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p jomad-ponto/work
          cat \
            jomad-ponto/chunks/part-00.txt \
            jomad-ponto/chunks/part-01.txt \
            jomad-ponto/chunks/part-02.txt \
            jomad-ponto/chunks/part-03-04.txt \
            jomad-ponto/chunks/part-05-06.txt \
            jomad-ponto/chunks/part-07-08.txt \
            > jomad-ponto/source.rebuilt.b64
          test "$(wc -c < jomad-ponto/source.rebuilt.b64)" -eq 31044
          base64 -d jomad-ponto/source.rebuilt.b64 > jomad-ponto/source.zip
          unzip -t jomad-ponto/source.zip
          unzip -q jomad-ponto/source.zip -d jomad-ponto/work
          test -f jomad-ponto/work/android/app/build.gradle.kts
          test -f jomad-ponto/work/android/app/src/main/assets/index.html

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable APK
        working-directory: jomad-ponto/work/android
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare final artifact
        shell: bash
        run: |
          set -euxo pipefail
          cp jomad-ponto/work/android/app/build/outputs/apk/debug/app-debug.apk JOMAD_Ponto_v1.1_Final.apk
          sha256sum JOMAD_Ponto_v1.1_Final.apk > JOMAD_Ponto_v1.1_Final.apk.sha256
          ls -lh JOMAD_Ponto_v1.1_Final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JOMAD-Ponto-v1.1-APK
          path: |
            JOMAD_Ponto_v1.1_Final.apk
            JOMAD_Ponto_v1.1_Final.apk.sha256
          if-no-files-found: error
          retention-days: 7
