name: Build PulseFit Clean APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da build
        uses: actions/checkout@v4
        with:
          ref: pulsefit-clean-build-20260805

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Confirmar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restaurar e validar HTML
        run: |
          mkdir -p pulsefit-clean/app/src/main/assets
          cat pulsefit-clean/html_b64_parts/part*.txt | base64 -d | gzip -dc > pulsefit-clean/app/src/main/assets/index.html
          test -s pulsefit-clean/app/src/main/assets/index.html
          grep -q "PulseFit" pulsefit-clean/app/src/main/assets/index.html

      - name: Compilar APK do zero
        run: gradle -p pulsefit-clean :app:assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p output
          cp pulsefit-clean/app/build/outputs/apk/debug/app-debug.apk output/PulseFit_Rotinas_Build_Limpa.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseFit-Rotinas-Build-Limpa
          path: output/PulseFit_Rotinas_Build_Limpa.apk
          if-no-files-found: error
