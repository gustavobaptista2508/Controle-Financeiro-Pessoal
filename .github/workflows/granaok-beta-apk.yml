name: GranaOk Beta APK

on:
  push:
    branches:
      - agent/granaok-beta
    paths:
      - 'GranaOk/**'
      - '.github/workflows/granaok-beta-apk.yml'
  workflow_dispatch:

jobs:
  build-beta-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GranaOk MySQL endpoint
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          host = 'gadobd.mysql.uhserver.com'
          port = 3306
          print(f'Testing TCP {host}:{port} ...')
          with socket.create_connection((host, port), timeout=8) as s:
              print('MySQL endpoint reachable:', s.getpeername())
          PY

      - name: Verify safe MySQL architecture
        shell: bash
        run: |
          grep -q 'android:process=":mysql"' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'MariaDbConnection.newConnection' GranaOk/android/app/src/main/java/com/granaok/app/DbWorkerService.java
          if grep -q 'Class.forName("org.mariadb.jdbc.Driver")' GranaOk/android/app/src/main/java/com/granaok/app/DbWorkerService.java; then
            echo 'Unsafe Driver class loading found in isolated worker'
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build GranaOk beta
        run: gradle -p GranaOk/android :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp GranaOk/android/app/build/outputs/apk/debug/app-debug.apk GranaOk-Beta-v0.3.4.apk

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: GranaOk-Beta-v0.3.4
          path: GranaOk-Beta-v0.3.4.apk
          if-no-files-found: error
          retention-days: 30
