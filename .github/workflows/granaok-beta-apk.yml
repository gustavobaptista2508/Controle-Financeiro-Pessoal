name: GranaOk Beta APK

on:
  push:
    branches:
      - agent/granaok-beta
    paths:
      - 'GranaOk/**'
      - '.github/workflows/granaok-beta-apk.yml'
  workflow_dispatch:

jobs:
  build-beta-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GranaOk MySQL endpoint
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          host = 'gadobd.mysql.uhserver.com'
          port = 3306
          print(f'Testing TCP {host}:{port} ...')
          with socket.create_connection((host, port), timeout=8) as s:
              print('MySQL endpoint reachable:', s.getpeername())
          PY

      - name: Validate public radar source
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, datetime
          end=datetime.date.today(); start=end-datetime.timedelta(days=60)
          q=urllib.parse.urlencode({'formato':'json','dataInicial':start.strftime('%d/%m/%Y'),'dataFinal':end.strftime('%d/%m/%Y')})
          url='https://api.bcb.gov.br/dados/serie/bcdata.sgs.1178/dados?'+q
          req=urllib.request.Request(url,headers={'User-Agent':'GranaOk-CI/0.5.1'})
          with urllib.request.urlopen(req,timeout=12) as r:
              data=json.load(r)
          assert data, 'BCB Selic returned no rows'
          print('BCB Selic OK:', data[-1])
          PY

      - name: Verify safe process architecture
        shell: bash
        run: |
          grep -q 'android:process=":mysql"' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'android:process=":radar"' GranaOk/android/app/src/main/AndroidManifest.xml
          for f in DbWorkerService.java FinanceWorkerService.java FinanceExtrasService.java PlanningService.java FinanceManageService.java ImportFinanceService.java HouseholdFinanceService.java; do
            grep -q 'MariaDbConnection.newConnection' "GranaOk/android/app/src/main/java/com/granaok/app/$f"
            if grep -q 'Class.forName("org.mariadb.jdbc.Driver")' "GranaOk/android/app/src/main/java/com/granaok/app/$f"; then
              echo "Unsafe Driver class loading found in $f"
              exit 1
            fi
          done

      - name: Verify beta 0.4.0 retained features
        shell: bash
        run: |
          grep -q 'FinanceManageService' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'ImportFinanceService' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'InvestmentRadarService' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'FileProvider' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q "com.google.mlkit:text-recognition:16.0.1" GranaOk/android/app/build.gradle
          grep -q 'ACTION_UPDATE_TRANSACTION' GranaOk/android/app/src/main/java/com/granaok/app/FinanceManageService.java
          grep -q 'ACTION_SET_STATUS' GranaOk/android/app/src/main/java/com/granaok/app/FinanceManageService.java
          grep -q 'parseReceipt' GranaOk/android/app/src/main/java/com/granaok/app/DocumentParser.java
          grep -q 'parseStatement' GranaOk/android/app/src/main/java/com/granaok/app/DocumentParser.java
          grep -q 'import_hash' GranaOk/android/app/src/main/java/com/granaok/app/ImportFinanceService.java
          grep -q 'latestBcb(1178' GranaOk/android/app/src/main/java/com/granaok/app/InvestmentRadarService.java
          grep -q 'receiptScanView' GranaOk/android/app/src/main/assets/www/tools-040.js
          grep -q 'statementImportView' GranaOk/android/app/src/main/assets/www/tools-040.js
          grep -q 'investmentRadarView' GranaOk/android/app/src/main/assets/www/tools-040.js
          grep -q 'changeTxMonth' GranaOk/android/app/src/main/assets/www/management-039.js
          grep -q 'editTransactionView' GranaOk/android/app/src/main/assets/www/management-039.js

      - name: Verify beta 0.5.0 retained features
        shell: bash
        run: |
          grep -q 'HouseholdFinanceService' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'ACTION_ADD_ENTITY' GranaOk/android/app/src/main/java/com/granaok/app/HouseholdFinanceService.java
          grep -q 'ACTION_ADD_TRANSACTION' GranaOk/android/app/src/main/java/com/granaok/app/HouseholdFinanceService.java
          grep -q 'ACTION_ADD_CARD_PURCHASE' GranaOk/android/app/src/main/java/com/granaok/app/HouseholdFinanceService.java
          grep -q 'ACTION_CARD_INVOICE' GranaOk/android/app/src/main/java/com/granaok/app/HouseholdFinanceService.java
          grep -q 'card_purchases' GranaOk/android/app/src/main/java/com/granaok/app/HouseholdFinanceService.java
          grep -q 'entity_kind' GranaOk/android/app/src/main/java/com/granaok/app/HouseholdFinanceService.java
          grep -q 'peopleView' GranaOk/android/app/src/main/assets/www/household-050.js
          grep -q 'tx50-account' GranaOk/android/app/src/main/assets/www/household-050.js
          grep -q 'newCardPurchaseView' GranaOk/android/app/src/main/assets/www/household-050.js
          grep -q 'cardInvoiceView' GranaOk/android/app/src/main/assets/www/household-050.js
          grep -q 'GranaInvestmentSimulator050' GranaOk/android/app/src/main/assets/www/assistant-050.js
          grep -q 'ai-chat-050' GranaOk/android/app/src/main/assets/www/assistant-050.js
          grep -q 'household-050.js' GranaOk/android/app/src/main/assets/www/index.html
          grep -q 'assistant-050.js' GranaOk/android/app/src/main/assets/www/index.html

      - name: Verify beta 0.5.1 Sicoob PDF fix
        shell: bash
        run: |
          grep -q 'MainActivityV051' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q "com.tom-roush:pdfbox-android:2.0.27.0" GranaOk/android/app/build.gradle
          grep -q 'PDFTextStripper' GranaOk/android/app/src/main/java/com/granaok/app/MainActivityV051.java
          grep -q 'ocr_fallback' GranaOk/android/app/src/main/java/com/granaok/app/MainActivityV051.java
          grep -q 'SicoobStatementParser.isSupported' GranaOk/android/app/src/main/java/com/granaok/app/MainActivityV051.java
          grep -q 'Sicoob Conta Corrente' GranaOk/android/app/src/main/java/com/granaok/app/SicoobStatementParser.java
          grep -q 'saldo do dia' GranaOk/android/app/src/main/java/com/granaok/app/SicoobStatementParser.java
          grep -q "BETA 0.5.1" GranaOk/android/app/src/main/assets/www/safe-version.js
          grep -q "versionName '0.5.1-beta'" GranaOk/android/app/build.gradle
          if grep -q 'MutationObserver' GranaOk/android/app/src/main/assets/www/safe-version.js; then
            echo 'Recursive version observer must not be present'
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build GranaOk beta
        run: gradle -p GranaOk/android :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp GranaOk/android/app/build/outputs/apk/debug/app-debug.apk GranaOk-Beta-v0.5.1.apk

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: GranaOk-Beta-v0.5.1
          path: GranaOk-Beta-v0.5.1.apk
          if-no-files-found: error
          retention-days: 30
