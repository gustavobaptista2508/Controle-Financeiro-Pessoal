name: GranaOk Beta APK

on:
  push:
    branches:
      - agent/granaok-beta
    paths:
      - 'GranaOk/**'
      - '.github/workflows/granaok-beta-apk.yml'
  workflow_dispatch:

jobs:
  build-beta-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build GranaOk beta
        run: gradle -p GranaOk/android :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp GranaOk/android/app/build/outputs/apk/debug/app-debug.apk GranaOk-Beta-v0.1.0.apk

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: GranaOk-Beta-v0.1.0
          path: GranaOk-Beta-v0.1.0.apk
          if-no-files-found: error
          retention-days: 30
