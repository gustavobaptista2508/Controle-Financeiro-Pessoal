name: GranaOk Beta APK

on:
  push:
    branches:
      - agent/granaok-beta
    paths:
      - 'GranaOk/**'
      - '.github/workflows/granaok-beta-apk.yml'
  workflow_dispatch:

jobs:
  build-beta-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GranaOk MySQL endpoint
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          host = 'gadobd.mysql.uhserver.com'
          port = 3306
          print(f'Testing TCP {host}:{port} ...')
          with socket.create_connection((host, port), timeout=8) as s:
              print('MySQL endpoint reachable:', s.getpeername())
          PY

      - name: Verify safe MySQL architecture
        shell: bash
        run: |
          grep -q 'android:process=":mysql"' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'PlanningService' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'MariaDbConnection.newConnection' GranaOk/android/app/src/main/java/com/granaok/app/DbWorkerService.java
          grep -q 'MariaDbConnection.newConnection' GranaOk/android/app/src/main/java/com/granaok/app/FinanceWorkerService.java
          grep -q 'MariaDbConnection.newConnection' GranaOk/android/app/src/main/java/com/granaok/app/FinanceExtrasService.java
          grep -q 'MariaDbConnection.newConnection' GranaOk/android/app/src/main/java/com/granaok/app/PlanningService.java
          for f in DbWorkerService.java FinanceWorkerService.java FinanceExtrasService.java PlanningService.java MainActivityUi.java MainActivityV037.java MainActivityV038.java; do
            if grep -q 'Class.forName("org.mariadb.jdbc.Driver")' "GranaOk/android/app/src/main/java/com/granaok/app/$f"; then
              echo "Unsafe Driver class loading found in $f"
              exit 1
            fi
          done

      - name: Verify beta 0.3.8 features
        shell: bash
        run: |
          grep -q 'MainActivityV038' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'windowOptOutEdgeToEdgeEnforcement' GranaOk/android/app/src/main/res/values/styles.xml
          grep -q 'ACTION_ADD_EXPENSE' GranaOk/android/app/src/main/java/com/granaok/app/FinanceExtrasService.java
          grep -q 'DEFAULT_CATEGORIES' GranaOk/android/app/src/main/java/com/granaok/app/FinanceExtrasService.java
          grep -q 'ACTION_NEXT_PROJECTION' GranaOk/android/app/src/main/java/com/granaok/app/PlanningService.java
          grep -q "\['sicoob','Sicoob'" GranaOk/android/app/src/main/assets/www/planning-038.js
          grep -q 'changeDashboardMonth' GranaOk/android/app/src/main/assets/www/planning-038.js
          grep -q 'projectNextMonthAI' GranaOk/android/app/src/main/assets/www/planning-038.js
          grep -q 'renderSimulation' GranaOk/android/app/src/main/assets/www/planning-038.js
          grep -q 'planning-038.js' GranaOk/android/app/src/main/assets/www/index.html
          if grep -q 'MutationObserver' GranaOk/android/app/src/main/assets/www/safe-version.js; then
            echo 'Recursive version observer must not be present'
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build GranaOk beta
        run: gradle -p GranaOk/android :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp GranaOk/android/app/build/outputs/apk/debug/app-debug.apk GranaOk-Beta-v0.3.8.apk

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: GranaOk-Beta-v0.3.8
          path: GranaOk-Beta-v0.3.8.apk
          if-no-files-found: error
          retention-days: 30
