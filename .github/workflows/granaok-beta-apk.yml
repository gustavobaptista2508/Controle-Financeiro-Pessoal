name: GranaOk Beta APK

on:
  push:
    branches:
      - agent/granaok-beta
    paths:
      - 'GranaOk/**'
      - '.github/workflows/granaok-beta-apk.yml'
  workflow_dispatch:

jobs:
  build-beta-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GranaOk MySQL endpoint
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          host = 'gadobd.mysql.uhserver.com'
          port = 3306
          print(f'Testing TCP {host}:{port} ...')
          with socket.create_connection((host, port), timeout=8) as s:
              print('MySQL endpoint reachable:', s.getpeername())
          PY

      - name: Validate public radar source
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, datetime
          end=datetime.date.today(); start=end-datetime.timedelta(days=60)
          q=urllib.parse.urlencode({'formato':'json','dataInicial':start.strftime('%d/%m/%Y'),'dataFinal':end.strftime('%d/%m/%Y')})
          url='https://api.bcb.gov.br/dados/serie/bcdata.sgs.1178/dados?'+q
          req=urllib.request.Request(url,headers={'User-Agent':'GranaOk-CI/0.4'})
          with urllib.request.urlopen(req,timeout=12) as r:
              data=json.load(r)
          assert data, 'BCB Selic returned no rows'
          print('BCB Selic OK:', data[-1])
          PY

      - name: Verify safe process architecture
        shell: bash
        run: |
          grep -q 'android:process=":mysql"' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'android:process=":radar"' GranaOk/android/app/src/main/AndroidManifest.xml
          for f in DbWorkerService.java FinanceWorkerService.java FinanceExtrasService.java PlanningService.java FinanceManageService.java ImportFinanceService.java; do
            grep -q 'MariaDbConnection.newConnection' "GranaOk/android/app/src/main/java/com/granaok/app/$f"
            if grep -q 'Class.forName("org.mariadb.jdbc.Driver")' "GranaOk/android/app/src/main/java/com/granaok/app/$f"; then
              echo "Unsafe Driver class loading found in $f"
              exit 1
            fi
          done

      - name: Verify beta 0.4.0 requested features
        shell: bash
        run: |
          grep -q 'MainActivityV040' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'FinanceManageService' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'ImportFinanceService' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'InvestmentRadarService' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q 'FileProvider' GranaOk/android/app/src/main/AndroidManifest.xml
          grep -q "com.google.mlkit:text-recognition:16.0.1" GranaOk/android/app/build.gradle
          grep -q 'ACTION_UPDATE_TRANSACTION' GranaOk/android/app/src/main/java/com/granaok/app/FinanceManageService.java
          grep -q 'ACTION_SET_STATUS' GranaOk/android/app/src/main/java/com/granaok/app/FinanceManageService.java
          grep -q 'observations' GranaOk/android/app/src/main/java/com/granaok/app/FinanceManageService.java
          grep -q 'effective_status' GranaOk/android/app/src/main/java/com/granaok/app/FinanceManageService.java
          grep -q 'parseReceipt' GranaOk/android/app/src/main/java/com/granaok/app/DocumentParser.java
          grep -q 'parseStatement' GranaOk/android/app/src/main/java/com/granaok/app/DocumentParser.java
          grep -q 'import_hash' GranaOk/android/app/src/main/java/com/granaok/app/ImportFinanceService.java
          grep -q 'bcdata.sgs.1178' GranaOk/android/app/src/main/java/com/granaok/app/InvestmentRadarService.java
          grep -q 'tesourodireto.com.br' GranaOk/android/app/src/main/java/com/granaok/app/InvestmentRadarService.java
          grep -q 'management-039.js' GranaOk/android/app/src/main/assets/www/index.html
          grep -q 'tools-040.js' GranaOk/android/app/src/main/assets/www/index.html
          grep -q 'receiptScanView' GranaOk/android/app/src/main/assets/www/tools-040.js
          grep -q 'statementImportView' GranaOk/android/app/src/main/assets/www/tools-040.js
          grep -q 'investmentRadarView' GranaOk/android/app/src/main/assets/www/tools-040.js
          grep -q 'changeTxMonth' GranaOk/android/app/src/main/assets/www/management-039.js
          grep -q 'editTransactionView' GranaOk/android/app/src/main/assets/www/management-039.js
          grep -q 'editAccountView' GranaOk/android/app/src/main/assets/www/management-039.js
          grep -q "BETA 0.4.0" GranaOk/android/app/src/main/assets/www/safe-version.js
          if grep -q 'MutationObserver' GranaOk/android/app/src/main/assets/www/safe-version.js; then
            echo 'Recursive version observer must not be present'
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build GranaOk beta
        run: gradle -p GranaOk/android :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp GranaOk/android/app/build/outputs/apk/debug/app-debug.apk GranaOk-Beta-v0.4.0.apk

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: GranaOk-Beta-v0.4.0
          path: GranaOk-Beta-v0.4.0.apk
          if-no-files-found: error
          retention-days: 30
