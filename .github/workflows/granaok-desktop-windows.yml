name: GranaOk Desktop Windows

on:
  push:
    branches:
      - agent/granaok-beta
    paths:
      - 'GranaOk/desktop/**'
      - '.github/workflows/granaok-desktop-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check GranaOk/desktop/main.js
          node --check GranaOk/desktop/preload.js
          node --check GranaOk/desktop/src/renderer.js

      - name: Reject literal escaped newlines
        shell: pwsh
        run: |
          $content = Get-Content GranaOk/desktop/main.js -Raw
          if ($content.Contains(';\n      return')) {
            throw 'Literal \\n token found in main.js'
          }

      - name: Verify advanced transaction filters
        shell: pwsh
        run: |
          if (-not (Select-String -Path GranaOk/desktop/src/renderer.js -Pattern 'tx-account' -Quiet)) { throw 'Account filter missing' }
          if (-not (Select-String -Path GranaOk/desktop/src/renderer.js -Pattern 'tx-observation' -Quiet)) { throw 'Observation filter missing' }
          if (-not (Select-String -Path GranaOk/desktop/main.js -Pattern "installments==='installment'" -Quiet)) { throw 'Installment filter missing' }

      - name: Verify LAN multi-user mode
        shell: pwsh
        run: |
          if (-not (Select-String -Path GranaOk/desktop/main.js -Pattern 'app_users' -Quiet)) { throw 'Multi-user table missing' }
          if (-not (Select-String -Path GranaOk/desktop/main.js -Pattern 'scryptSync' -Quiet)) { throw 'Password hashing missing' }
          if (-not (Select-String -Path GranaOk/desktop/main.js -Pattern "listen(port,'0.0.0.0'" -Quiet)) { throw 'LAN listener missing' }
          if (-not (Select-String -Path GranaOk/desktop/src/renderer.js -Pattern 'iPhone & Usuários' -Quiet)) { throw 'Desktop LAN screen missing' }
          if (-not (Test-Path GranaOk/desktop/src/lan/index.html)) { throw 'LAN mobile index missing' }
          if (-not (Test-Path GranaOk/desktop/src/lan/app.js)) { throw 'LAN mobile app missing' }
          node --check GranaOk/desktop/src/lan/app.js

      - name: Install dependencies
        working-directory: GranaOk/desktop
        run: npm install --no-audit --no-fund

      - name: Build portable Windows app
        working-directory: GranaOk/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: GranaOk-Desktop-v0.2.0-Windows-x64
          path: GranaOk/desktop/dist/GranaOk-Desktop-v0.2.0-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
