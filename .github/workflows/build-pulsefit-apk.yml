name: Build PulseFit Rotinas APK

on:
  push:
    branches:
      - build-pulsefit-apk-20260805
    paths-ignore:
      - 'pulsefit-build/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'pulsefit-build/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: build-pulsefit-apk-20260805

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restaurar HTML incorporado
        run: |
          mkdir -p pulsefit-app/app/src/main/assets
          gzip -dc pulsefit-app/index.html.gz > pulsefit-app/app/src/main/assets/index.html

      - name: Compilar APK
        run: gradle -p pulsefit-app :app:assembleDebug --no-daemon

      - name: Preparar arquivo
        run: |
          mkdir -p pulsefit-build
          cp pulsefit-app/app/build/outputs/apk/debug/app-debug.apk pulsefit-build/PulseFit_Rotinas.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: PulseFit-Rotinas-APK
          path: pulsefit-build/PulseFit_Rotinas.apk
          if-no-files-found: error

      - name: Salvar APK na branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pulsefit-build/PulseFit_Rotinas.apk
          git commit -m "Adicionar APK PulseFit Rotinas compilado" || exit 0
          git push origin HEAD:build-pulsefit-apk-20260805
