name: Auditoria eleitoral 2026 - logs TSE

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *' # Diário, processamento progressivo das UFs ainda pendentes
  push:
    paths:
      - '.github/workflows/auditoria-eleitoral-2026.yml'

permissions:
  contents: write

concurrency:
  group: auditoria-eleitoral-tse-2026
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.tse.outputs.available }}
    steps:
      - name: Testar se o TSE já publicou os arquivos do 2º turno
        id: tse
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, os
          url='https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes2026/arqurnatot/bu_imgbu_logjez_rdv_vscmr_2026_2t_ES.zip'
          request=urllib.request.Request(url,headers={'Range':'bytes=0-0','User-Agent':'BI-Eleicoes-2026/1.0'})
          try:
              with urllib.request.urlopen(request,timeout=40) as response:
                  ok=response.status==206
          except (urllib.error.URLError,TimeoutError) as e:
              print('Fonte ainda indisponível:',e);ok=False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'available={str(ok).lower()}\n')
          print('Pacote 2t disponível:',ok)
          PY

  coletar:
    needs: preflight
    if: needs.preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        uf: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
    steps:
      - uses: actions/checkout@v4
      - name: Testar processamento e reconciliação antes da coleta
        if: matrix.uf == 'ES'
        working-directory: eleicoes2026
        run: python -m unittest discover -s tests -v
      - name: Reutilizar estado já processado
        id: cache
        shell: bash
        env:
          UF: ${{ matrix.uf }}
        run: |
          if [ -s "eleicoes2026/data/ufs/${UF}.json" ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Extrair os eventos diretamente do ZIP oficial via HTTP Range
        if: steps.cache.outputs.exists == 'false'
        working-directory: eleicoes2026
        env:
          UF: ${{ matrix.uf }}
          PYTHONUNBUFFERED: '1'
        run: python coletor_tse.py --uf "$UF" --output "data/ufs/${UF}.json"
      - name: Salvar consolidado da UF como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uf-${{ matrix.uf }}
          path: eleicoes2026/data/ufs/${{ matrix.uf }}.json
          if-no-files-found: ignore
          retention-days: 2

  publicar:
    needs: [preflight, coletar]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar UFs processadas nesta rodada
        if: needs.coletar.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: uf-*
          path: eleicoes2026/data/ufs
          merge-multiple: true
        continue-on-error: true
      - name: Atualizar dados públicos de cobertura
        working-directory: eleicoes2026
        run: python agregador.py
      - name: Gravar a saída pública, sem dados brutos nem informações pessoais
        shell: bash
        run: |
          git config user.name 'tse-audit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A eleicoes2026/data
          if git diff --cached --quiet; then
            echo 'Sem alterações de dados.'
          else
            git commit -m 'data: atualizar contagem por horario em logs TSE 2026'
            git push
          fi
