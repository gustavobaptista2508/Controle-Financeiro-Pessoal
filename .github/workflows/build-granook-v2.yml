name: Build GranaOK Android v2

on:
  push:
    branches:
      - granook-android-v2-clean
    paths:
      - 'granook-android/**'
      - '!granook-android/build-output/**'
      - '.github/workflows/build-granook-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: granook-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build stable portrait APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register workflow run
        shell: bash
        run: |
          set -e
          mkdir -p granook-android/build-output
          printf '%s\n' "$GITHUB_RUN_ID" > granook-android/build-output/RUN_ID.txt
          printf 'building\n' > granook-android/build-output/STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add granook-android/build-output/RUN_ID.txt granook-android/build-output/STATUS.txt
          git commit -m 'Registrar build GranaOK v2' || true
          git push origin HEAD:granook-android-v2-clean

      - name: Restore clean Android source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/source_b64_parts/part* | base64 -d > /tmp/granook-src.tar.gz
          tar -xzf /tmp/granook-src.tar.gz
          test -s granook-android/app/src/main/java/br/com/granook/mobile/MainActivity.java
          test -s granook-android/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore embedded web app and icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p granook-android/app/src/main/assets
          mkdir -p granook-android/app/src/main/res/drawable-nodpi
          cat granook-android/html_b64_parts/part* | base64 -d | gzip -dc > granook-android/app/src/main/assets/index.html
          cat granook-android/icon_b64_parts/part* | base64 -d > granook-android/app/src/main/res/drawable-nodpi/granook_icon.png
          test -s granook-android/app/src/main/assets/index.html
          test -s granook-android/app/src/main/res/drawable-nodpi/granook_icon.png
          grep -q 'Extrato bancário universal' granook-android/app/src/main/assets/index.html
          grep -q 'authForm' granook-android/app/src/main/assets/index.html

      - name: Build unsigned release APK
        shell: bash
        run: gradle -p granook-android :app:clean :app:assembleRelease --no-daemon --stacktrace

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          UNSIGNED="granook-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="/tmp/GranaOK-aligned-unsigned.apk"
          OUTDIR="granook-android/output"
          mkdir -p "$OUTDIR"
          test -s "$UNSIGNED"
          "$ZIPALIGN" -f 4 "$UNSIGNED" "$ALIGNED"
          keytool -genkeypair -v \
            -keystore /tmp/granook-release.jks \
            -storepass 'GranaOK-2026!' \
            -keypass 'GranaOK-2026!' \
            -alias granook \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname 'CN=GranaOK, OU=Mobile, O=GranaOK, L=Marataizes, ST=ES, C=BR'
          "$APKSIGNER" sign \
            --ks /tmp/granook-release.jks \
            --ks-pass pass:'GranaOK-2026!' \
            --key-pass pass:'GranaOK-2026!' \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTDIR/GranaOK_2.0.0_estavel.apk" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUTDIR/GranaOK_2.0.0_estavel.apk" | tee "$OUTDIR/ASSINATURA.txt"
          "$ZIPALIGN" -c -v 4 "$OUTDIR/GranaOK_2.0.0_estavel.apk"
          sha256sum "$OUTDIR/GranaOK_2.0.0_estavel.apk" > "$OUTDIR/SHA256.txt"
          unzip -l "$OUTDIR/GranaOK_2.0.0_estavel.apk" | grep -E 'classes.dex|assets/index.html|granook_icon' > "$OUTDIR/ESTRUTURA.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GranaOK-2.0.0-estavel
          path: granook-android/output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish successful build metadata
        if: success()
        shell: bash
        run: |
          set -e
          printf 'success\n' > granook-android/build-output/STATUS.txt
          cp granook-android/output/SHA256.txt granook-android/build-output/SHA256.txt
          cp granook-android/output/ASSINATURA.txt granook-android/build-output/ASSINATURA.txt
          git add granook-android/build-output
          git commit -m 'Concluir build estável GranaOK v2' || true
          git push origin HEAD:granook-android-v2-clean

      - name: Publish failed build metadata
        if: failure()
        shell: bash
        run: |
          printf 'failure\n' > granook-android/build-output/STATUS.txt
          git add granook-android/build-output/STATUS.txt granook-android/build-output/RUN_ID.txt
          git commit -m 'Registrar falha no build GranaOK v2' || true
          git push origin HEAD:granook-android-v2-clean || true
