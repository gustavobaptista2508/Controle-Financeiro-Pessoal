name: Build GranaOK Android v2

on:
  push:
    branches: [granook-android-v2-clean]
    paths:
      - 'granook-android/**'
      - '!granook-android/build-output/**'
      - '.github/workflows/build-granook-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: granook-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build stable portrait APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register workflow run
        shell: bash
        run: |
          mkdir -p granook-android/build-output
          printf '%s\n' "$GITHUB_RUN_ID" > granook-android/build-output/RUN_ID.txt
          printf 'building\n' > granook-android/build-output/STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add granook-android/build-output
          git commit -m 'Registrar build final GranaOK' || true
          git push origin HEAD:granook-android-v2-clean || true

      - name: Restore clean Android source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/source_b64_parts/part* | base64 -d > /tmp/granook-src.tar.gz
          tar -xzf /tmp/granook-src.tar.gz
          test -s granook-android/app/src/main/java/br/com/granook/mobile/MainActivity.java
          cat > granook-android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Restore embedded app and icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p granook-android/app/src/main/assets
          mkdir -p granook-android/app/src/main/res/drawable-nodpi
          cat granook-android/html_b64_parts/part* | base64 -d | gzip -dc > granook-android/app/src/main/assets/index.html
          cat granook-android/icon_b64_parts/part* | base64 -d > granook-android/app/src/main/res/drawable-nodpi/granook_icon.png
          test -s granook-android/app/src/main/assets/index.html
          test -s granook-android/app/src/main/res/drawable-nodpi/granook_icon.png
          grep -q 'Extrato bancário universal' granook-android/app/src/main/assets/index.html
          grep -q 'authForm' granook-android/app/src/main/assets/index.html

      - name: Build installable APK
        shell: bash
        run: gradle -p granook-android :app:clean :app:assembleDebug --no-daemon --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APK="granook-android/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p granook-android/output
          test -s "$APK"
          cp "$APK" granook-android/output/GranaOK_2.0.0_final.apk
          "$APKSIGNER" verify --verbose --print-certs granook-android/output/GranaOK_2.0.0_final.apk | tee granook-android/output/ASSINATURA.txt
          "$ZIPALIGN" -c -v 4 granook-android/output/GranaOK_2.0.0_final.apk
          sha256sum granook-android/output/GranaOK_2.0.0_final.apk > granook-android/output/SHA256.txt
          unzip -l granook-android/output/GranaOK_2.0.0_final.apk | grep -E 'classes.dex|assets/index.html|granook_icon' > granook-android/output/ESTRUTURA.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: GranaOK-2.0.0-final
          path: granook-android/output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish build status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then printf 'success\n' > granook-android/build-output/STATUS.txt; else printf 'failure\n' > granook-android/build-output/STATUS.txt; fi
          git add granook-android/build-output || true
          git commit -m 'Atualizar status build final GranaOK' || true
          git push origin HEAD:granook-android-v2-clean || true
