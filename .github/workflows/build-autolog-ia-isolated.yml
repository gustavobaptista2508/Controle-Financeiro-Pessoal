name: Build AutoLog IA Isolated APK

on:
  push:
    branches: [autolog-ia-build]
    paths:
      - '.github/workflows/build-autolog-ia-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Restore AutoLog IA source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('autolog-ia-source.part04')
          s = p.read_text()
          for pos in (1125, 2221, 3257, 3749):
              assert s[pos] == 'I', (pos, s[pos])
              s = s[:pos] + 'Y' + s[pos+1:]
          p.write_text(s)
          PY
          echo 'c699d85353421b5ce0bd918acf9ea5cd477266bea55e6e98afceb6e8cb7112d6  autolog-ia-source.part00' | sha256sum -c -
          echo 'e0be702e72900dfb01313dec7a4912e8b6016b24c6af1b05d387f9e1af3071de  autolog-ia-source.part01' | sha256sum -c -
          echo 'fe0893edac0ed809dcf70938dceb97370fa29cfe60ff09e72250743111d4d609  autolog-ia-source.part02' | sha256sum -c -
          echo 'b308e6bf66c4f59133d010c662c8c9a086dca979466fa0d8a04f637193f30168  autolog-ia-source.part03' | sha256sum -c -
          echo 'f9360a0c5e89b5c1c63d4e505ec0715b94eade0f55b37479f4cd85c3e3f23176  autolog-ia-source.part04' | sha256sum -c -
          echo 'fdf4112d6c136447852406530b0b08904167201212619ca62d74cad2f6ca1ff2  autolog-ia-source.part05' | sha256sum -c -
          echo '85aee144f3d597d172fcf91220d84d59eea9561bf8fb6f13acbe35779c31f8f1  autolog-ia-source.part06' | sha256sum -c -
          echo '585eb22497a47b876bb4afdce4f0f82e7b51a96702c50f2aa8dbd3aa3f0a44d3  autolog-ia-source.part07' | sha256sum -c -
          echo '9af0f0349988b279e2c71aa4943fb664825da429a1ac0319d65b011251ca1148  autolog-ia-source.part08' | sha256sum -c -
          cat autolog-ia-source.part00 autolog-ia-source.part01 autolog-ia-source.part02 autolog-ia-source.part03 autolog-ia-source.part04 autolog-ia-source.part05 autolog-ia-source.part06 autolog-ia-source.part07 autolog-ia-source.part08 > /tmp/AutoLogIA_source.b64
          echo 'aadede6392191a634ee364a50b38660472397998d2af34aec88add1c2cab66b7  /tmp/AutoLogIA_source.b64' | sha256sum -c -
          base64 --decode /tmp/AutoLogIA_source.b64 > /tmp/AutoLogIA_source.zip
          echo '7a79b5fa4674e92e046c2618ba2ce1152ff14f4372b922c6947784eb620150e5  /tmp/AutoLogIA_source.zip' | sha256sum -c -
          unzip -t /tmp/AutoLogIA_source.zip
          rm -rf /tmp/autolog-src autolog-ia
          unzip -q /tmp/AutoLogIA_source.zip -d /tmp/autolog-src
          mv /tmp/autolog-src/AutoLogIA ./autolog-ia

      - name: Apply crash-safe 1.0.1 patch
        shell: bash
        run: |
          echo 'ad906ee1ac8a51d0f46bfe7ea317470923446fddfb6942e1cf6f5f1b1e9a7ed4  autolog-fix01.00' | sha256sum -c -
          echo '9d16d110f83fa9427f727a7fe005d6754bc90d1d099f8d5b0b37ba9098a1dfb1  autolog-fix01.01' | sha256sum -c -
          echo '6d6c0fbbdddd3ab215191be1d368e27843b9c586b0e9cb17fe38c7b8b3c002e7  autolog-fix01.02' | sha256sum -c -
          echo 'e8e86f273dccd48ba9bd9b2d4860f6a1bd6edbb0376ab924072fad1ba4cdf3d1  autolog-fix01.03' | sha256sum -c -
          echo 'eeac45061cacf934b9388a9d2a963812852a26bcc0dee6efcd04fb3bf548477d  autolog-fix01.04' | sha256sum -c -
          echo '61ea2a8b1dfad6e9e536ce46a08050346af52d4b445bc633577a68320f976a76  autolog-fix01.05' | sha256sum -c -
          cat autolog-fix01.00 autolog-fix01.01 autolog-fix01.02 autolog-fix01.03 autolog-fix01.04 autolog-fix01.05 > /tmp/autolog-v101.patch.gz.b64
          echo '1e986df4989a740ec14b941b7c50ae71cc27adc4034435836b556db688e9e9c4  /tmp/autolog-v101.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/autolog-v101.patch.gz.b64 | gzip -dc > /tmp/autolog-v101.patch
          (cd autolog-ia && patch -p1 < /tmp/autolog-v101.patch)
          echo '0ec71d0ed333a6078b6c15f9dbd7d3e8214dd8d464053cb57bc71a2eb8844328  autolog-ia/app/src/main/java/com/autologia/app/MainActivity.java' | sha256sum -c -
          echo '5d6f068484865f739d1252da6a563b45e17c1d91319c61cdd479da26d96cc277  autolog-ia/app/build.gradle' | sha256sum -c -

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 15 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle Bootstrap 5.3.8
        run: |
          mkdir -p autolog-ia/app/src/main/assets/web/vendor
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css -o autolog-ia/app/src/main/assets/web/vendor/bootstrap.min.css
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js -o autolog-ia/app/src/main/assets/web/vendor/bootstrap.bundle.min.js

      - name: Build APK
        working-directory: autolog-ia
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging autolog-ia/app/build/outputs/apk/debug/app-debug.apk | head -5
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 -v 4 autolog-ia/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare artifact
        run: cp autolog-ia/app/build/outputs/apk/debug/app-debug.apk AutoLog-IA-1.0.1-beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoLog-IA-APK-1.0.1
          path: AutoLog-IA-1.0.1-beta.apk
          if-no-files-found: error
