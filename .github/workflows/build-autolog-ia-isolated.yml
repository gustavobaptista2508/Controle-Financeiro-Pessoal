name: Build AutoLog IA Isolated APK

on:
  push:
    branches: [autolog-ia-build]
    paths:
      - 'autolog-ia-source.zip.b64'
      - '.github/workflows/build-autolog-ia-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Restore AutoLog IA source
        shell: bash
        run: |
          base64 --decode autolog-ia-source.zip.b64 > /tmp/AutoLogIA_source.zip
          unzip -t /tmp/AutoLogIA_source.zip
          unzip -q /tmp/AutoLogIA_source.zip -d /tmp/autolog-src
          mv /tmp/autolog-src/AutoLogIA ./autolog-ia

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 15 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle Bootstrap 5.3.8
        run: |
          mkdir -p autolog-ia/app/src/main/assets/web/vendor
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css -o autolog-ia/app/src/main/assets/web/vendor/bootstrap.min.css
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js -o autolog-ia/app/src/main/assets/web/vendor/bootstrap.bundle.min.js

      - name: Build APK
        working-directory: autolog-ia
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: cp autolog-ia/app/build/outputs/apk/debug/app-debug.apk AutoLog-IA-1.0.0-beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoLog-IA-APK
          path: AutoLog-IA-1.0.0-beta.apk
          if-no-files-found: error
