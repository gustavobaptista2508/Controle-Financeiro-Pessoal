name: Build AutoLog IA Isolated APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Restore and verify AutoLog IA source
        shell: bash
        run: |
          echo 'Verify source chunks:'
          echo '8beabd8243db72616d1ffdfbfa66d62ab43ba3c0ba3bf9107b9fa1ab8aa4800b  autolog-ia-source.part00' | sha256sum -c -
          echo 'e0be702e72900dfb01313dec7a4912e8b6016b24c6af1b05d387f9e1af3071de  autolog-ia-source.part01' | sha256sum -c -
          echo 'e31e4a0e199c20e2f0c6492e9b3a0043a1dc6550337940136342786933d73ead  autolog-ia-source.part02' | sha256sum -c -
          echo '8c391aaa15f340c7e47e7fec453e0a620486e87e0db29cc91db2ad5609a8ec6a  autolog-ia-source.part03' | sha256sum -c -
          echo 'f3bc53e9cb302ff283f559e0e25b70a0da427b80027105cae8ba2d2345402e82  autolog-ia-source.part04' | sha256sum -c -
          echo '2c7531f7888472988842ac1ead763853f1caeb39e4161032a8cccf7ea9ec60dd  autolog-ia-source.part05' | sha256sum -c -
          echo '0829b3ec0ee74c16001cb552e9f199534f996307f5f6e2cf6a7b53097a51f221  autolog-ia-source.part06' | sha256sum -c -
          echo '071d0b02cb4560f55c30b7426c6131e76774667d94465f45c8ce88d482529be2  autolog-ia-source.part07' | sha256sum -c -
          echo '3d3b1974c81488d6998b4f577b192c47b0f5a934f1dfe2a9b58b12703bb7fb9d  autolog-ia-source.part08' | sha256sum -c -
          cat autolog-ia-source.part00 autolog-ia-source.part01 autolog-ia-source.part02 autolog-ia-source.part03 autolog-ia-source.part04 autolog-ia-source.part05 autolog-ia-source.part06 autolog-ia-source.part07 autolog-ia-source.part08 > /tmp/AutoLogIA_source.b64
          echo '85b826a0311aae032c2f8d6f7a52eb4c646b0d5816647dc303149ab7d095c800  /tmp/AutoLogIA_source.b64' | sha256sum -c -
          base64 --decode /tmp/AutoLogIA_source.b64 > /tmp/AutoLogIA_source.zip
          echo 'a0cbf5f53f3040700acf972c88b01f1d266da752b6e174eec3e186b38abde7ef  /tmp/AutoLogIA_source.zip' | sha256sum -c -
          unzip -t /tmp/AutoLogIA_source.zip
          rm -rf /tmp/autolog-src autolog-ia
          unzip -q /tmp/AutoLogIA_source.zip -d /tmp/autolog-src
          mv /tmp/autolog-src/AutoLogIA ./autolog-ia

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 15 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle Bootstrap 5.3.8
        run: |
          mkdir -p autolog-ia/app/src/main/assets/web/vendor
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css -o autolog-ia/app/src/main/assets/web/vendor/bootstrap.min.css
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js -o autolog-ia/app/src/main/assets/web/vendor/bootstrap.bundle.min.js

      - name: Build APK
        working-directory: autolog-ia
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging autolog-ia/app/build/outputs/apk/debug/app-debug.apk | head -5
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 -v 4 autolog-ia/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare artifact
        run: cp autolog-ia/app/build/outputs/apk/debug/app-debug.apk AutoLog-IA-1.0.1-beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoLog-IA-APK-1.0.1
          path: AutoLog-IA-1.0.1-beta.apk
          if-no-files-found: error
