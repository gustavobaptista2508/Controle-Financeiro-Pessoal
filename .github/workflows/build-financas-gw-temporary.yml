name: Build Financas GW Temporary

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && contains(github.event.comment.body, '/build-financas-gw'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout da build financeira
        uses: actions/checkout@v4
        with:
          ref: pulsefit-clean-build-final-20260805
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restaurar HTML incorporado
        run: |
          mkdir -p pulsefit-clean/app/src/main/assets
          cat pulsefit-clean/html_b64_parts/part*.txt | base64 -d | gzip -dc > pulsefit-clean/app/src/main/assets/index.html
          test -s pulsefit-clean/app/src/main/assets/index.html
          grep -q 'Finanças GW' pulsefit-clean/app/src/main/assets/index.html

      - name: Compilar APK assinado
        run: gradle -p pulsefit-clean :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          APK=pulsefit-clean/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p output
          cp "$APK" output/Financas_GW_Android_v1.0.0.apk
          sha256sum output/Financas_GW_Android_v1.0.0.apk > output/SHA256.txt

      - name: Publicar artefato temporário
        uses: actions/upload-artifact@v4
        with:
          name: Financas-GW-Android-v1.0.0
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release temporária
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete financas-gw-v1.0.0 --cleanup-tag --yes || true
          gh release create financas-gw-v1.0.0 \
            output/Financas_GW_Android_v1.0.0.apk \
            output/SHA256.txt \
            --target pulsefit-clean-build-final-20260805 \
            --title 'Finanças GW Android v1.0.0' \
            --notes 'Aplicativo Android gerado a partir da planilha Controle Financeiro Gustavo e Wanessa.'

      - name: Registrar resultado na branch de build
        run: |
          mkdir -p pulsefit-clean/build-output
          base64 -w 4000 output/Financas_GW_Android_v1.0.0.apk > pulsefit-clean/build-output/Financas_GW_Android_v1.0.0.apk.b64
          cp output/SHA256.txt pulsefit-clean/build-output/SHA256.txt
          printf 'sucesso\n' > pulsefit-clean/build-output/STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pulsefit-clean/build-output
          git commit -m 'Publicar APK Finanças GW compilado' || true
          git push origin HEAD:pulsefit-clean-build-final-20260805
